aid: okteto

name: Okteto

description: 'Okteto is a development-environment platform built on Kubernetes. Its site says it "gives coding agents production-like environments
  to verify their work": isolated, full-stack environments that run on your own infrastructure. Teams use it for Kubernetes development environments,
  preview environments and testing of cloud-native applications. Okteto publishes an open-source CLI (github.com/okteto/okteto), reference documentation,
  release notes and a community forum.'

