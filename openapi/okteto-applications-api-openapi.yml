openapi: 3.2.0
info:
  title: Okteto Applications API
  version: 0.1.0
  contact:
    email: support@okteto.com
  description: 'Operations tagged applications across 2 of this provider''s published API definitions: okteto-public-api-openapi.yaml, okteto-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Okteto's public URL
  url: https://{oktetoURL}/api/v0
  variables:
    oktetoURL:
      default: okteto.test.com
security:
- BearerAuth: []
tags:
- description: Operations about applications
  name: Applications
paths:
  /namespaces/{namespaceName}/applications:
    get:
      description: Returns a list of applications deployed within a namespace.
      operationId: ListApplicationsForNamespace
      parameters:
      - description: Namespace name where the applications are deployed.
        explode: false
        in: path
        name: namespaceName
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Application'
                type: array
          description: A list of applications.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Access token is missing or invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Provided token does not have the necessary permissions to perform the operation
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Requested resource was not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error
      summary: Get list of applications deployed within a namespace
      tags:
      - Applications
    servers:
    - description: Okteto's public URL
      url: https://{oktetoURL}/api/v0
      variables:
        oktetoURL:
          default: okteto.test.com
components:
  schemas:
    ErrorResponse:
      example:
        message: message
      properties:
        message:
          type: string
      type: object
    Application:
      example:
        lastUpdated: 2000-01-23 04:56:07+00:00
        name: name
        creationDate: 2000-01-23 04:56:07+00:00
        repository: repository
        branch: branch
        uuid: uuid
        labels:
        - labels
        - labels
        status: Deployed
      properties:
        branch:
          description: Indicates the branch from where the application was deployed. It could be empty
          type: string
        creationDate:
          description: Date and time when the application was created.
          format: date-time
          type: string
        labels:
          description: Labels attached to the application
          items:
            type: string
          type: array
        lastUpdated:
          description: Date and time when the application was last updated.
          format: date-time
          type: string
        name:
          description: Name of the application.
          type: string
        repository:
          description: Indicates the repository from where the application was deployed. It could be empty
          type: string
        status:
          description: Status of the application
          enum:
          - Deployed
          - Destroying
          - Error
          - Progressing
          type: string
        uuid:
          description: Unique identifier of the application.
          type: string
      required:
      - creationDate
      - lastUpdated
      - name
      - status
      - uuid
      type: object
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
externalDocs:
  description: Find out more about Okteto
  url: https://okteto.com/docs
x-refined-from:
- okteto-public-api-openapi.yaml
- okteto-openapi.yml
